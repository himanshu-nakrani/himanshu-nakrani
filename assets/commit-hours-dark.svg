<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t4">
  <title id="t4">A 24-bar histogram of commit times in IST, plotted noon to noon: bars climb through the evening into a night block holding 61 percent of commits between 22:00 and 05:00, peaking at 213 commits at 02:00, then collapse into a near-empty morning trough of 20 commits across 06:00 to 11:00. A small weekday strip beneath shows Sunday highest at 339 commits; 37 percent of commits land on weekends.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .txt { fill: #95a0ac; }
    .ink { stroke: #8b949e; }
    .stubs rect { fill: #7d97ee; fill-opacity: 0.35; }
    .bar {
      stroke: #7d97ee; stroke-width: 21; stroke-linecap: butt;
      animation: rise 0.55s cubic-bezier(0.2,0.6,0.25,1) forwards;
    }
    .dbar {
      stroke: #7d97ee; stroke-width: 16; stroke-linecap: butt;
      animation: rise 0.55s cubic-bezier(0.2,0.6,0.25,1) forwards;
    }
    .fade { opacity: 0; animation: fadein 0.7s cubic-bezier(0.33,0,0.2,1) forwards; }
    .dotf { fill: #d29922; }
    .ring { stroke: #d29922; fill: none; }
    .d0 { animation-delay: 0.05s; }
    .ds { animation-delay: 0.35s; }
    .dc { animation-delay: 2.45s; }
    .dn { animation-delay: 2.7s;  }
    .dt { animation-delay: 2.95s; }
    .dp { animation-delay: 3.3s;  }
    .dw { animation-delay: 3.55s; }
    .dl { animation-delay: 3.7s;  }
    @keyframes rise   { to { stroke-dashoffset: 0; } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .dbar { animation: none; stroke-dashoffset: 0; }
      .fade { animation: none; opacity: 1; }
      .ring { display: none; }
    }
  </style>

  <!-- frame: gridlines, axes, ticks, tick labels -->
  <g class="fade d0">
    <g class="ink" stroke-width="0.75" opacity="0.22">
      <line x1="56.5" y1="80.5" x2="824" y2="80.5"/>
      <line x1="56.5" y1="110.5" x2="824" y2="110.5"/>
      <line x1="56.5" y1="140.5" x2="824" y2="140.5"/>
      <line x1="56.5" y1="170.5" x2="824" y2="170.5"/>
    </g>
    <g class="ink" stroke-width="1" opacity="0.8">
      <line x1="56.5" y1="36" x2="56.5" y2="200.5"/>
      <line x1="56.5" y1="200.5" x2="824" y2="200.5"/>
      <line x1="63.5" y1="296.5" x2="234" y2="296.5"/>
    </g>
    <g class="ink" stroke-width="1" opacity="0.8">
      <line x1="51" y1="80.5" x2="56.5" y2="80.5"/>
      <line x1="51" y1="110.5" x2="56.5" y2="110.5"/>
      <line x1="51" y1="140.5" x2="56.5" y2="140.5"/>
      <line x1="51" y1="170.5" x2="56.5" y2="170.5"/>
      <line x1="80" y1="200.5" x2="80" y2="206"/>
      <line x1="174.5" y1="200.5" x2="174.5" y2="206"/>
      <line x1="269" y1="200.5" x2="269" y2="206"/>
      <line x1="363.5" y1="200.5" x2="363.5" y2="206"/>
      <line x1="458" y1="200.5" x2="458" y2="206"/>
      <line x1="552.5" y1="200.5" x2="552.5" y2="206"/>
      <line x1="647" y1="200.5" x2="647" y2="206"/>
      <line x1="741.5" y1="200.5" x2="741.5" y2="206"/>
    </g>
    <g class="txt" font-size="9" opacity="0.75" text-anchor="end">
      <text x="47" y="83.5">200</text>
      <text x="47" y="113.5">150</text>
      <text x="47" y="143.5">100</text>
      <text x="47" y="173.5">50</text>
      <text x="47" y="203.5">0</text>
    </g>
    <g class="txt" font-size="9.5" opacity="0.75" text-anchor="middle">
      <text x="80" y="219">noon</text>
      <text x="174.5" y="219">15:00</text>
      <text x="269" y="219">18:00</text>
      <text x="363.5" y="219">21:00</text>
      <text x="458" y="219">midnight</text>
      <text x="552.5" y="219">03:00</text>
      <text x="647" y="219">06:00</text>
      <text x="741.5" y="219">09:00</text>
    </g>
    <text class="txt" x="52" y="24" font-size="11" letter-spacing="1.5">commits by hour &#183; ist (utc+5:30)</text>
    <text class="txt" x="824" y="24" font-size="9" letter-spacing="1" text-anchor="end" opacity="0.65">n = 1,582 &#183; 40 repos &#183; jul &#8217;25 &#8594; jul &#8217;26</text>
    <text class="txt" x="52" y="256" font-size="10" letter-spacing="1.5" opacity="0.8">by day</text>
    <g class="txt" font-size="9" opacity="0.7" text-anchor="middle">
      <text x="76" y="310">mon</text>
      <text x="100" y="310">tue</text>
      <text x="124" y="310">wed</text>
      <text x="148" y="310">thu</text>
      <text x="172" y="310">fri</text>
      <text x="196" y="310">sat</text>
      <text x="220" y="310">sun</text>
    </g>
  </g>

  <!-- trough mornings: five faint stubs, in the manner of fig. 2's silent weeks -->
  <g class="stubs fade ds">
    <rect x="636.5" y="199.5" width="21" height="1"/>
    <rect x="668" y="199.5" width="21" height="1"/>
    <rect x="699.5" y="199.5" width="21" height="1"/>
    <rect x="731" y="199.5" width="21" height="1"/>
    <rect x="762.5" y="199.5" width="21" height="1"/>
  </g>

  <!-- the series: 24 hours, noon to noon, rising left to right (0.6px per commit) -->
  <g>
    <line class="bar" style="animation-delay:0.5s" x1="80" y1="200.5" x2="80" y2="190.3" stroke-dasharray="10.2" stroke-dashoffset="10.2"/>
    <line class="bar" style="animation-delay:0.57s" x1="111.5" y1="200.5" x2="111.5" y2="190.9" stroke-dasharray="9.6" stroke-dashoffset="9.6"/>
    <line class="bar" style="animation-delay:0.64s" x1="143" y1="200.5" x2="143" y2="177.1" stroke-dasharray="23.4" stroke-dashoffset="23.4"/>
    <line class="bar" style="animation-delay:0.71s" x1="174.5" y1="200.5" x2="174.5" y2="172.3" stroke-dasharray="28.2" stroke-dashoffset="28.2"/>
    <line class="bar" style="animation-delay:0.78s" x1="206" y1="200.5" x2="206" y2="145.9" stroke-dasharray="54.6" stroke-dashoffset="54.6"/>
    <line class="bar" style="animation-delay:0.85s" x1="237.5" y1="200.5" x2="237.5" y2="159.1" stroke-dasharray="41.4" stroke-dashoffset="41.4"/>
    <line class="bar" style="animation-delay:0.92s" x1="269" y1="200.5" x2="269" y2="146.5" stroke-dasharray="54" stroke-dashoffset="54"/>
    <line class="bar" style="animation-delay:0.99s" x1="300.5" y1="200.5" x2="300.5" y2="170.5" stroke-dasharray="30" stroke-dashoffset="30"/>
    <line class="bar" style="animation-delay:1.06s" x1="332" y1="200.5" x2="332" y2="168.7" stroke-dasharray="31.8" stroke-dashoffset="31.8"/>
    <line class="bar" style="animation-delay:1.13s" x1="363.5" y1="200.5" x2="363.5" y2="179.5" stroke-dasharray="21" stroke-dashoffset="21"/>
    <line class="bar" style="animation-delay:1.2s" x1="395" y1="200.5" x2="395" y2="147.1" stroke-dasharray="53.4" stroke-dashoffset="53.4"/>
    <line class="bar" style="animation-delay:1.27s" x1="426.5" y1="200.5" x2="426.5" y2="117.1" stroke-dasharray="83.4" stroke-dashoffset="83.4"/>
    <line class="bar" style="animation-delay:1.34s" x1="458" y1="200.5" x2="458" y2="138.1" stroke-dasharray="62.4" stroke-dashoffset="62.4"/>
    <line class="bar" style="animation-delay:1.41s" x1="489.5" y1="200.5" x2="489.5" y2="94.3" stroke-dasharray="106.2" stroke-dashoffset="106.2"/>
    <line class="bar" style="animation-delay:1.48s" x1="521" y1="200.5" x2="521" y2="72.7" stroke-dasharray="127.8" stroke-dashoffset="127.8"/>
    <line class="bar" style="animation-delay:1.55s" x1="552.5" y1="200.5" x2="552.5" y2="110.5" stroke-dasharray="90" stroke-dashoffset="90"/>
    <line class="bar" style="animation-delay:1.62s" x1="584" y1="200.5" x2="584" y2="141.7" stroke-dasharray="58.8" stroke-dashoffset="58.8"/>
    <line class="bar" style="animation-delay:1.69s" x1="615.5" y1="200.5" x2="615.5" y2="164.5" stroke-dasharray="36" stroke-dashoffset="36"/>
    <line class="bar" style="animation-delay:1.76s" x1="647" y1="200.5" x2="647" y2="196.9" stroke-dasharray="3.6" stroke-dashoffset="3.6"/>
    <line class="bar" style="animation-delay:1.83s" x1="678.5" y1="200.5" x2="678.5" y2="199.9" stroke-dasharray="0.6" stroke-dashoffset="0.6"/>
    <line class="bar" style="animation-delay:1.9s" x1="710" y1="200.5" x2="710" y2="199.9" stroke-dasharray="0.6" stroke-dashoffset="0.6"/>
    <line class="bar" style="animation-delay:1.97s" x1="741.5" y1="200.5" x2="741.5" y2="196.3" stroke-dasharray="4.2" stroke-dashoffset="4.2"/>
    <line class="bar" style="animation-delay:2.04s" x1="773" y1="200.5" x2="773" y2="197.5" stroke-dasharray="3" stroke-dashoffset="3"/>
    <line class="bar" style="animation-delay:2.11s" x1="804.5" y1="200.5" x2="804.5" y2="185.5" stroke-dasharray="15" stroke-dashoffset="15"/>
  </g>

  <!-- region annotations, in the manner of fig. 1's stage markers -->
  <text class="txt fade dc" x="224" y="58" font-size="11" letter-spacing="2" text-anchor="middle" opacity="0.9">the evening climb</text>
  <g class="fade dn">
    <line class="ink" x1="379.25" y1="48" x2="379.25" y2="200.5" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.5"/>
    <text class="txt" x="385.5" y="58" font-size="11" letter-spacing="2" opacity="0.9">the night shift</text>
    <text class="txt" x="385.5" y="71" font-size="9" letter-spacing="1.5" opacity="0.65">61% of commits</text>
    <text class="txt" x="385.5" y="84" font-size="9" letter-spacing="1.5" opacity="0.65">22:00 &#8594; 05:00</text>
  </g>
  <g class="fade dt">
    <line class="ink" x1="599.75" y1="48" x2="599.75" y2="200.5" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.5"/>
    <text class="txt" x="660" y="58" font-size="11" letter-spacing="2" opacity="0.9">the trough</text>
    <text class="txt" x="660" y="71" font-size="9" letter-spacing="1.5" opacity="0.65">06:00 &#8594; 11:00 &#183; 20 commits</text>
  </g>

  <!-- peak point + annotation -->
  <circle class="dotf fade dp" cx="521" cy="72.7" r="3.2"/>
  <circle class="ring" cx="521" cy="72.7" r="3.5" stroke-width="1" opacity="0">
    <animate attributeName="r" values="3.5;12" keyTimes="0;1" dur="2s" begin="3.5s" repeatCount="1" calcMode="spline" keySplines="0.25 0 0.4 1"/>
    <animate attributeName="opacity" values="0.55;0" keyTimes="0;1" dur="2s" begin="3.5s" repeatCount="1" calcMode="spline" keySplines="0.25 0 0.4 1"/>
  </circle>
  <g class="fade dl">
    <line class="ink" x1="527" y1="72.7" x2="535" y2="72.7" stroke-width="0.75" opacity="0.6"/>
    <text class="txt" x="539" y="76.5" font-size="11.5">peak &#183; 02:00</text>
    <text class="txt" x="539" y="91.5" font-size="10.5" opacity="0.75">213 commits</text>
  </g>

  <!-- day-of-week strip: mon to sun (0.105px per commit) -->
  <g>
    <line class="dbar" style="animation-delay:2.35s" x1="76" y1="296.5" x2="76" y2="276.44" stroke-dasharray="20.055" stroke-dashoffset="20.055"/>
    <line class="dbar" style="animation-delay:2.44s" x1="100" y1="296.5" x2="100" y2="273.82" stroke-dasharray="22.68" stroke-dashoffset="22.68"/>
    <line class="dbar" style="animation-delay:2.53s" x1="124" y1="296.5" x2="124" y2="268.25" stroke-dasharray="28.245" stroke-dashoffset="28.245"/>
    <line class="dbar" style="animation-delay:2.62s" x1="148" y1="296.5" x2="148" y2="282.12" stroke-dasharray="14.385" stroke-dashoffset="14.385"/>
    <line class="dbar" style="animation-delay:2.71s" x1="172" y1="296.5" x2="172" y2="276.44" stroke-dasharray="20.055" stroke-dashoffset="20.055"/>
    <line class="dbar" style="animation-delay:2.8s" x1="196" y1="296.5" x2="196" y2="271.4" stroke-dasharray="25.095" stroke-dashoffset="25.095"/>
    <line class="dbar" style="animation-delay:2.89s" x1="220" y1="296.5" x2="220" y2="260.9" stroke-dasharray="35.595" stroke-dashoffset="35.595"/>
  </g>

  <!-- sunday annotation -->
  <g class="fade dw">
    <line class="ink" x1="231" y1="261.9" x2="239" y2="261.9" stroke-width="0.75" opacity="0.6"/>
    <text class="txt" x="243" y="265.7" font-size="10.5">sundays &#183; 339</text>
    <text class="txt" x="243" y="279.7" font-size="9.5" opacity="0.75">37% of commits land on weekends</text>
  </g>
</svg>
