<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t4">
  <title id="t4">A 24-bar histogram of commit times in IST, plotted noon to noon: bars climb through the evening into a night block holding 62 percent of commits between 22:00 and 05:00, peaking at 230 commits at 02:00, then collapse into a morning trough of 31 commits across 06:00 to 11:00. A small weekday strip beneath shows Sunday highest at 421 commits; 38 percent of commits land on weekends.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .txt { fill: #95a0ac; }
    .ink { stroke: #8b949e; }
    .stubs rect { fill: #7d97ee; fill-opacity: 0.35; }
    .bar {
      stroke: #7d97ee; stroke-width: 21; stroke-linecap: butt;
      animation: rise 0.55s cubic-bezier(0.2,0.6,0.25,1) forwards;
    }
    .dbar {
      stroke: #7d97ee; stroke-width: 16; stroke-linecap: butt;
      animation: rise 0.55s cubic-bezier(0.2,0.6,0.25,1) forwards;
    }
    .fade { opacity: 0; animation: fadein 0.7s cubic-bezier(0.33,0,0.2,1) forwards; }
    .dotf { fill: #d29922; }
    .ring { stroke: #d29922; fill: none; }
    .d0 { animation-delay: 0.05s; }
    .ds { animation-delay: 0.35s; }
    .dc { animation-delay: 2.45s; }
    .dn { animation-delay: 2.7s;  }
    .dt { animation-delay: 2.95s; }
    .dp { animation-delay: 3.3s;  }
    .dw { animation-delay: 3.55s; }
    .dl { animation-delay: 3.7s;  }
    @keyframes rise   { to { stroke-dashoffset: 0; } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .dbar { animation: none; stroke-dashoffset: 0; }
      .fade { animation: none; opacity: 1; }
      .ring { display: none; }
    }
  </style>

  <!-- frame: gridlines, axes, ticks, tick labels -->
  <g class="fade d0">
    <g class="ink" stroke-width="0.75" opacity="0.22">
      <line x1="56.5" y1="95.5" x2="824" y2="95.5"/>
      <line x1="56.5" y1="130.5" x2="824" y2="130.5"/>
      <line x1="56.5" y1="165.5" x2="824" y2="165.5"/>
    </g>
    <g class="ink" stroke-width="1" opacity="0.8">
      <line x1="56.5" y1="36" x2="56.5" y2="200.5"/>
      <line x1="56.5" y1="200.5" x2="824" y2="200.5"/>
      <line x1="63.5" y1="296.5" x2="234" y2="296.5"/>
    </g>
    <g class="ink" stroke-width="1" opacity="0.8">
      <line x1="51" y1="95.5" x2="56.5" y2="95.5"/>
      <line x1="51" y1="130.5" x2="56.5" y2="130.5"/>
      <line x1="51" y1="165.5" x2="56.5" y2="165.5"/>
      <line x1="80" y1="200.5" x2="80" y2="206"/>
      <line x1="174.5" y1="200.5" x2="174.5" y2="206"/>
      <line x1="269" y1="200.5" x2="269" y2="206"/>
      <line x1="363.5" y1="200.5" x2="363.5" y2="206"/>
      <line x1="458" y1="200.5" x2="458" y2="206"/>
      <line x1="552.5" y1="200.5" x2="552.5" y2="206"/>
      <line x1="647" y1="200.5" x2="647" y2="206"/>
      <line x1="741.5" y1="200.5" x2="741.5" y2="206"/>
    </g>
    <g class="txt" font-size="9" opacity="0.75" text-anchor="end">
      <text x="47" y="98.5">150</text>
      <text x="47" y="133.5">100</text>
      <text x="47" y="168.5">50</text>
      <text x="47" y="203.5">0</text>
    </g>
    <g class="txt" font-size="9.5" opacity="0.75" text-anchor="middle">
      <text x="80" y="219">noon</text>
      <text x="174.5" y="219">15:00</text>
      <text x="269" y="219">18:00</text>
      <text x="363.5" y="219">21:00</text>
      <text x="458" y="219">midnight</text>
      <text x="552.5" y="219">03:00</text>
      <text x="647" y="219">06:00</text>
      <text x="741.5" y="219">09:00</text>
    </g>
    <text class="txt" x="52" y="24" font-size="11" letter-spacing="1.5">commits by hour &#183; ist (utc+5:30)</text>
    <text class="txt" x="824" y="24" font-size="9" letter-spacing="1" text-anchor="end" opacity="0.65">n = 2,063 &#183; 39 repos &#183; sep &#8217;25 &#8594; sep &#8217;26</text>
    <text class="txt" x="52" y="256" font-size="10" letter-spacing="1.5" opacity="0.8">by day</text>
    <g class="txt" font-size="9" opacity="0.7" text-anchor="middle">
      <text x="76" y="310">mon</text>
      <text x="100" y="310">tue</text>
      <text x="124" y="310">wed</text>
      <text x="148" y="310">thu</text>
      <text x="172" y="310">fri</text>
      <text x="196" y="310">sat</text>
      <text x="220" y="310">sun</text>
    </g>
  </g>

  <!-- trough mornings: faint stubs for the empty hours, in the manner of fig. 2's silent weeks -->
  <g class="stubs fade ds">
    <rect x="668" y="199.5" width="21" height="1"/>
    <rect x="699.5" y="199.5" width="21" height="1"/>
  </g>

  <!-- the series: 24 hours, noon to noon, rising left to right (0.7px per commit) -->
  <g>
    <line class="bar" style="animation-delay:0.50s" x1="80" y1="200.5" x2="80" y2="187.9" stroke-dasharray="12.60" stroke-dashoffset="12.60"/>
    <line class="bar" style="animation-delay:0.57s" x1="111.5" y1="200.5" x2="111.5" y2="189.3" stroke-dasharray="11.20" stroke-dashoffset="11.20"/>
    <line class="bar" style="animation-delay:0.64s" x1="143" y1="200.5" x2="143" y2="166.9" stroke-dasharray="33.60" stroke-dashoffset="33.60"/>
    <line class="bar" style="animation-delay:0.71s" x1="174.5" y1="200.5" x2="174.5" y2="165.5" stroke-dasharray="35.00" stroke-dashoffset="35.00"/>
    <line class="bar" style="animation-delay:0.78s" x1="206" y1="200.5" x2="206" y2="93.4" stroke-dasharray="107.10" stroke-dashoffset="107.10"/>
    <line class="bar" style="animation-delay:0.85s" x1="237.5" y1="200.5" x2="237.5" y2="107.4" stroke-dasharray="93.10" stroke-dashoffset="93.10"/>
    <line class="bar" style="animation-delay:0.92s" x1="269" y1="200.5" x2="269" y2="99.7" stroke-dasharray="100.80" stroke-dashoffset="100.80"/>
    <line class="bar" style="animation-delay:0.99s" x1="300.5" y1="200.5" x2="300.5" y2="155.7" stroke-dasharray="44.80" stroke-dashoffset="44.80"/>
    <line class="bar" style="animation-delay:1.06s" x1="332" y1="200.5" x2="332" y2="162.7" stroke-dasharray="37.80" stroke-dashoffset="37.80"/>
    <line class="bar" style="animation-delay:1.13s" x1="363.5" y1="200.5" x2="363.5" y2="166.2" stroke-dasharray="34.30" stroke-dashoffset="34.30"/>
    <line class="bar" style="animation-delay:1.20s" x1="395" y1="200.5" x2="395" y2="127.7" stroke-dasharray="72.80" stroke-dashoffset="72.80"/>
    <line class="bar" style="animation-delay:1.27s" x1="426.5" y1="200.5" x2="426.5" y2="77.3" stroke-dasharray="123.20" stroke-dashoffset="123.20"/>
    <line class="bar" style="animation-delay:1.34s" x1="458" y1="200.5" x2="458" y2="85" stroke-dasharray="115.50" stroke-dashoffset="115.50"/>
    <line class="bar" style="animation-delay:1.41s" x1="489.5" y1="200.5" x2="489.5" y2="52.1" stroke-dasharray="148.40" stroke-dashoffset="148.40"/>
    <line class="bar" style="animation-delay:1.48s" x1="521" y1="200.5" x2="521" y2="39.5" stroke-dasharray="161.00" stroke-dashoffset="161.00"/>
    <line class="bar" style="animation-delay:1.55s" x1="552.5" y1="200.5" x2="552.5" y2="45.8" stroke-dasharray="154.70" stroke-dashoffset="154.70"/>
    <line class="bar" style="animation-delay:1.62s" x1="584" y1="200.5" x2="584" y2="128.4" stroke-dasharray="72.10" stroke-dashoffset="72.10"/>
    <line class="bar" style="animation-delay:1.69s" x1="615.5" y1="200.5" x2="615.5" y2="155" stroke-dasharray="45.50" stroke-dashoffset="45.50"/>
    <line class="bar" style="animation-delay:1.76s" x1="647" y1="200.5" x2="647" y2="196.3" stroke-dasharray="4.20" stroke-dashoffset="4.20"/>
    <line class="bar" style="animation-delay:1.83s" x1="678.5" y1="200.5" x2="678.5" y2="199.8" stroke-dasharray="0.70" stroke-dashoffset="0.70"/>
    <line class="bar" style="animation-delay:1.90s" x1="710" y1="200.5" x2="710" y2="199.8" stroke-dasharray="0.70" stroke-dashoffset="0.70"/>
    <line class="bar" style="animation-delay:1.97s" x1="741.5" y1="200.5" x2="741.5" y2="190.7" stroke-dasharray="9.80" stroke-dashoffset="9.80"/>
    <line class="bar" style="animation-delay:2.04s" x1="773" y1="200.5" x2="773" y2="194.2" stroke-dasharray="6.30" stroke-dashoffset="6.30"/>
    <line class="bar" style="animation-delay:2.11s" x1="804.5" y1="200.5" x2="804.5" y2="181.6" stroke-dasharray="18.90" stroke-dashoffset="18.90"/>
  </g>

  <!-- region annotations, in the manner of fig. 1's stage markers -->
  <text class="txt fade dc" x="155" y="52" font-size="11" letter-spacing="1.5" text-anchor="middle" opacity="0.9">the evening climb</text>
  <g class="fade dn">
    <line class="ink" x1="379.25" y1="48" x2="379.25" y2="200.5" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.5"/>
    <text class="txt" x="373.25" y="72" font-size="11" letter-spacing="2" text-anchor="end" opacity="0.9">the night shift</text>
    <text class="txt" x="373.25" y="85" font-size="9" letter-spacing="1.5" text-anchor="end" opacity="0.65">62% of commits</text>
    <text class="txt" x="373.25" y="98" font-size="9" letter-spacing="1.5" text-anchor="end" opacity="0.65">22:00 &#8594; 05:00</text>
  </g>
  <g class="fade dt">
    <line class="ink" x1="631.25" y1="48" x2="631.25" y2="200.5" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.5"/>
    <text class="txt" x="637.25" y="58" font-size="11" letter-spacing="2" opacity="0.9">the trough</text>
    <text class="txt" x="637.25" y="71" font-size="9" letter-spacing="1.5" opacity="0.65">06:00 &#8594; 11:00 &#183; 31 commits</text>
  </g>

  <!-- peak point + annotation (above the 01:00 bar, which now rises almost as high) -->
  <circle class="dotf fade dp" cx="521" cy="39.5" r="3.2"/>
  <circle class="ring" cx="521" cy="39.5" r="3.5" stroke-width="1" opacity="0">
    <animate attributeName="r" values="3.5;12" keyTimes="0;1" dur="2s" begin="3.5s" repeatCount="1" calcMode="spline" keySplines="0.25 0 0.4 1"/>
    <animate attributeName="opacity" values="0.55;0" keyTimes="0;1" dur="2s" begin="3.5s" repeatCount="1" calcMode="spline" keySplines="0.25 0 0.4 1"/>
  </circle>
  <g class="fade dl">
    <line class="ink" x1="515" y1="39.5" x2="507" y2="39.5" stroke-width="0.75" opacity="0.6"/>
    <text class="txt" x="503" y="31.5" font-size="11.5" text-anchor="end">peak &#183; 02:00</text>
    <text class="txt" x="503" y="44.5" font-size="10.5" text-anchor="end" opacity="0.75">230 commits</text>
  </g>

  <!-- day-of-week strip: mon to sun (0.105px per commit) -->
  <g>
    <line class="dbar" style="animation-delay:2.35s" x1="76" y1="296.5" x2="76" y2="269.2" stroke-dasharray="27.30" stroke-dashoffset="27.30"/>
    <line class="dbar" style="animation-delay:2.44s" x1="100" y1="296.5" x2="100" y2="269.62" stroke-dasharray="26.88" stroke-dashoffset="26.88"/>
    <line class="dbar" style="animation-delay:2.53s" x1="124" y1="296.5" x2="124" y2="264.79" stroke-dasharray="31.71" stroke-dashoffset="31.71"/>
    <line class="dbar" style="animation-delay:2.62s" x1="148" y1="296.5" x2="148" y2="277.18" stroke-dasharray="19.32" stroke-dashoffset="19.32"/>
    <line class="dbar" style="animation-delay:2.71s" x1="172" y1="296.5" x2="172" y2="267.52" stroke-dasharray="28.98" stroke-dashoffset="28.98"/>
    <line class="dbar" style="animation-delay:2.80s" x1="196" y1="296.5" x2="196" y2="258.28" stroke-dasharray="38.22" stroke-dashoffset="38.22"/>
    <line class="dbar" style="animation-delay:2.89s" x1="220" y1="296.5" x2="220" y2="252.29" stroke-dasharray="44.21" stroke-dashoffset="44.21"/>
  </g>

  <!-- sunday annotation -->
  <g class="fade dw">
    <line class="ink" x1="231" y1="252.29" x2="239" y2="252.29" stroke-width="0.75" opacity="0.6"/>
    <text class="txt" x="243" y="256.09" font-size="10.5">sundays &#183; 421</text>
    <text class="txt" x="243" y="270.09" font-size="9.5" opacity="0.75">38% of commits land on weekends</text>
  </g>
</svg>
