    <line class="bar" style="animation-delay:1.55s" x1="552.5" y1="200.5" x2="552.5" y2="65.5" stroke-dasharray="135.00" stroke-dashoffset="135.00"/>
    <line class="bar" style="animation-delay:1.62s" x1="584" y1="200.5" x2="584" y2="138.7" stroke-dasharray="61.80" stroke-dashoffset="61.80"/>
