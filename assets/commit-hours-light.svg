<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t4">
  <title id="t4">A 24-bar histogram of commits authored by himanshu-nakrani on the default branches of public non-fork repositories from 2025-10-24 00:00:00 UTC through 2026-10-23 23:59:59 UTC, shown in IST (UTC+5:30) and plotted noon to noon. It covers 2,261 commits across 39 repos. The 22:00–05:59 night window holds 1,350 commits (60 percent), peaking at 241 commits at 02:00. The 06:00–11:59 morning trough totals 72 commits. The weekday strip shows Sunday highest at 460 commits; Saturday and Sunday account for 840 commits (37 percent).</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .txt { fill: #6e7781; }
    .ink { stroke: #6e7781; }
    .stubs rect { fill: #4f6ad0; fill-opacity: 0.35; }
    .bar {
      stroke: #4f6ad0; stroke-width: 21; stroke-linecap: butt;
      animation: rise 0.55s cubic-bezier(0.2,0.6,0.25,1) forwards;
    }
    .dbar {
      stroke: #4f6ad0; stroke-width: 16; stroke-linecap: butt;
      animation: rise 0.55s cubic-bezier(0.2,0.6,0.25,1) forwards;
    }
    .fade { opacity: 0; animation: fadein 0.7s cubic-bezier(0.33,0,0.2,1) forwards; }
    .dotf { fill: #bf8700; }
    .ring { stroke: #bf8700; fill: none; }
    .d0 { animation-delay: 0.05s; }
    .ds { animation-delay: 0.35s; }
    .dc { animation-delay: 2.45s; }
    .dn { animation-delay: 2.7s;  }
    .dt { animation-delay: 2.95s; }
    .dp { animation-delay: 3.3s;  }
    .dw { animation-delay: 3.55s; }
    .dl { animation-delay: 3.7s;  }
    @keyframes rise   { to { stroke-dashoffset: 0; } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .dbar { animation: none; stroke-dashoffset: 0; }
      .fade { animation: none; opacity: 1; }
      .ring { display: none; }
    }
  </style>

  <!-- frame: gridlines, axes, ticks, tick labels -->
  <g class="fade d0">
