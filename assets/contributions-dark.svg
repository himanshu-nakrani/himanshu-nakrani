    <rect x="296" y="199.5" width="10.5" height="1"/>
    <rect x="310.5" y="199.5" width="10.5" height="1"/>
    <rect x="325" y="199.5" width="10.5" height="1"/>
    <rect x="339.5" y="199.5" width="10.5" height="1"/>
    <rect x="354" y="199.5" width="10.5" height="1"/>
    <rect x="383" y="199.5" width="10.5" height="1"/>
  </g>

  <!-- the series: active weeks rising left to right (0.45px per contribution) -->
  <g>
    <line class="bar" style="animation-delay:0.500s" x1="373.75" y1="200.5" x2="373.75" y2="196.9" stroke-dasharray="3.60" stroke-dashoffset="3.60"/>
    <line class="bar" style="animation-delay:0.575s" x1="402.75" y1="200.5" x2="402.75" y2="178" stroke-dasharray="22.50" stroke-dashoffset="22.50"/>
    <line class="bar" style="animation-delay:0.650s" x1="417.25" y1="200.5" x2="417.25" y2="164.05" stroke-dasharray="36.45" stroke-dashoffset="36.45"/>
