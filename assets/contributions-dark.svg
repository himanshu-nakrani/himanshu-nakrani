  <!-- ignition annotation, in the manner of fig. 1's stage markers -->
  <g class="fade di">
    <line class="ink" x1="397.5" y1="48" x2="397.5" y2="200.5" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.5"/>
    <text class="txt" x="403.5" y="58" font-size="11" letter-spacing="2" opacity="0.9">ignition</text>
    <text class="txt" x="403.5" y="71" font-size="9" letter-spacing="1.5" opacity="0.65">mar &#8217;26</text>
  </g>

  <!-- peak point + annotation -->
  <circle class="dotf fade dp" cx="620.25" cy="41.2" r="3.2"/>
  <circle class="ring" cx="620.25" cy="41.2" r="3.5" stroke-width="1" opacity="0">
    <animate attributeName="r" values="3.5;12" keyTimes="0;1" dur="2s" begin="3.2s" repeatCount="1" calcMode="spline" keySplines="0.25 0 0.4 1"/>
    <animate attributeName="opacity" values="0.55;0" keyTimes="0;1" dur="2s" begin="3.2s" repeatCount="1" calcMode="spline" keySplines="0.25 0 0.4 1"/>
  </circle>
  <g class="fade dl">
    <line class="ink" x1="605" y1="41.2" x2="613" y2="41.2" stroke-width="0.75" opacity="0.6"/>
    <text class="txt" x="601" y="45" font-size="11.5" text-anchor="end">peak &#183; 354</text>
    <text class="txt" x="601" y="60" font-size="10.5" text-anchor="end" opacity="0.75">wk of jun 28</text>
  </g>

  <!-- current week is only two days in; mark it so the short bar is not read as a drop -->
  <g class="fade dl">
    <line class="ink" x1="808.75" y1="150.8" x2="808.75" y2="171.7" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.55"/>
