    <line class="bar" style="animation-delay:1.250s" x1="533.25" y1="200.5" x2="533.25" y2="150.55" stroke-dasharray="49.95" stroke-dashoffset="49.95"/>
    <line class="bar" style="animation-delay:1.325s" x1="547.75" y1="200.5" x2="547.75" y2="126.7" stroke-dasharray="73.80" stroke-dashoffset="73.80"/>
    <line class="bar" style="animation-delay:1.400s" x1="562.25" y1="200.5" x2="562.25" y2="138.85" stroke-dasharray="61.65" stroke-dashoffset="61.65"/>
