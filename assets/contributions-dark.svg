    <line class="bar" style="animation-delay:1.550s" x1="591.25" y1="200.5" x2="591.25" y2="149.65" stroke-dasharray="50.85" stroke-dashoffset="50.85"/>
    <line class="bar" style="animation-delay:1.625s" x1="605.75" y1="200.5" x2="605.75" y2="152.8" stroke-dasharray="47.70" stroke-dashoffset="47.70"/>
    <line class="bar" style="animation-delay:1.700s" x1="620.25" y1="200.5" x2="620.25" y2="41.2" stroke-dasharray="159.30" stroke-dashoffset="159.30"/>
    <line class="bar" style="animation-delay:1.775s" x1="634.75" y1="200.5" x2="634.75" y2="122.65" stroke-dasharray="77.85" stroke-dashoffset="77.85"/>
    <line class="bar" style="animation-delay:1.850s" x1="649.25" y1="200.5" x2="649.25" y2="136.15" stroke-dasharray="64.35" stroke-dashoffset="64.35"/>
