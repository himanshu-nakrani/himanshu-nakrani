    <rect x="296" y="199.5" width="10.5" height="1"/>
    <rect x="310.5" y="199.5" width="10.5" height="1"/>
    <rect x="325" y="199.5" width="10.5" height="1"/>
    <rect x="339.5" y="199.5" width="10.5" height="1"/>
    <rect x="354" y="199.5" width="10.5" height="1"/>
    <rect x="368.5" y="199.5" width="10.5" height="1"/>
    <rect x="383" y="199.5" width="10.5" height="1"/>
    <rect x="397.5" y="199.5" width="10.5" height="1"/>
    <rect x="412" y="199.5" width="10.5" height="1"/>
    <rect x="426.5" y="199.5" width="10.5" height="1"/>
    <rect x="441" y="199.5" width="10.5" height="1"/>
    <rect x="455.5" y="199.5" width="10.5" height="1"/>
