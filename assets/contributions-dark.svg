    <line class="bar" style="animation-delay:1.550s" x1="649.25" y1="200.5" x2="649.25" y2="149.65" stroke-dasharray="50.85" stroke-dashoffset="50.85"/>
    <line class="bar" style="animation-delay:1.625s" x1="663.75" y1="200.5" x2="663.75" y2="152.80" stroke-dasharray="47.70" stroke-dashoffset="47.70"/>
