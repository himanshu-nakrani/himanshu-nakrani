    <line class="bar" style="animation-delay:2.000s" x1="678.25" y1="200.5" x2="678.25" y2="166.3" stroke-dasharray="34.20" stroke-dashoffset="34.20"/>
    <line class="bar" style="animation-delay:2.075s" x1="692.75" y1="200.5" x2="692.75" y2="147.4" stroke-dasharray="53.10" stroke-dashoffset="53.10"/>
    <line class="bar" style="animation-delay:2.150s" x1="707.25" y1="200.5" x2="707.25" y2="160" stroke-dasharray="40.50" stroke-dashoffset="40.50"/>
