    <line class="bar" style="animation-delay:0.575s" x1="460.75" y1="200.5" x2="460.75" y2="178.00" stroke-dasharray="22.50" stroke-dashoffset="22.50"/>
    <line class="bar" style="animation-delay:0.650s" x1="475.25" y1="200.5" x2="475.25" y2="164.05" stroke-dasharray="36.45" stroke-dashoffset="36.45"/>
