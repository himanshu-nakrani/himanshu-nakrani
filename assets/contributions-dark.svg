    <line class="bar" style="animation-delay:1.175s" x1="576.75" y1="200.5" x2="576.75" y2="170.35" stroke-dasharray="30.15" stroke-dashoffset="30.15"/>
    <line class="bar" style="animation-delay:1.250s" x1="591.25" y1="200.5" x2="591.25" y2="150.55" stroke-dasharray="49.95" stroke-dashoffset="49.95"/>
