    <line class="bar" style="animation-delay:0.800s" x1="446.25" y1="200.5" x2="446.25" y2="163.6" stroke-dasharray="36.90" stroke-dashoffset="36.90"/>
    <line class="bar" style="animation-delay:0.875s" x1="460.75" y1="200.5" x2="460.75" y2="156.4" stroke-dasharray="44.10" stroke-dashoffset="44.10"/>
    <line class="bar" style="animation-delay:0.950s" x1="475.25" y1="200.5" x2="475.25" y2="167.2" stroke-dasharray="33.30" stroke-dashoffset="33.30"/>
