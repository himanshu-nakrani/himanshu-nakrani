<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 124" width="880" height="124" role="img" aria-labelledby="t3">
  <title id="t3">A single horizontal stacked bar of code bytes by language across 58 source repositories: TypeScript 38.6 percent, Jupyter Notebook 34.3 percent, flagged as byte-inflated by embedded cell outputs, HTML 12.0 percent, Python 6.3 percent, then JavaScript, MDX, CSS, and other.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .txt { fill: #95a0ac; }
    .ink { stroke: #8b949e; }
    .fillg {
      transform-box: fill-box; transform-origin: left center;
      transform: scaleX(0);
      animation: growx 1.7s cubic-bezier(0.45,0.05,0.4,1) 0.4s forwards;
    }
    .fade { opacity: 0; animation: fadein 0.7s cubic-bezier(0.33,0,0.2,1) forwards; }
    .d0 { animation-delay: 0.05s; }
    .d1 { animation-delay: 2.05s; }
    .d2 { animation-delay: 2.4s;  }
    @keyframes growx  { to { transform: scaleX(1); } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fillg { animation: none; transform: none; }
      .fade  { animation: none; opacity: 1; }
    }
  </style>

  <!-- frame: header row, empty track, scale ticks -->
  <g class="fade d0">
    <text class="txt" x="52" y="24" font-size="11" letter-spacing="1.5">bytes by language</text>
    <text class="txt" x="824" y="24" font-size="9" letter-spacing="1" text-anchor="end" opacity="0.65">44,832,408 bytes &#183; 58 source repos &#183; forks excluded</text>
    <rect class="ink" x="63.5" y="51.5" width="753" height="21.0" fill="none" stroke-width="0.75" opacity="0.45"/>
    <g class="ink" stroke-width="1" opacity="0.8">
      <line x1="64" y1="72.5" x2="64" y2="77.0"/>
      <line x1="252" y1="72.5" x2="252" y2="77.0"/>
      <line x1="440" y1="72.5" x2="440" y2="77.0"/>
      <line x1="628" y1="72.5" x2="628" y2="77.0"/>
      <line x1="816" y1="72.5" x2="816" y2="77.0"/>
    </g>
    <text class="txt" x="64" y="89.0" font-size="9" text-anchor="middle" opacity="0.7">0</text>
    <text class="txt" x="252" y="89.0" font-size="9" text-anchor="middle" opacity="0.7">25</text>
    <text class="txt" x="440" y="89.0" font-size="9" text-anchor="middle" opacity="0.7">50</text>
    <text class="txt" x="628" y="89.0" font-size="9" text-anchor="middle" opacity="0.7">75</text>
    <text class="txt" x="816" y="89.0" font-size="9" text-anchor="middle" opacity="0.7">100%</text>
  </g>

  <!-- the stacked bar, filling once, left to right -->
  <g class="fillg">
    <rect x="64.00" y="52.0" width="290.39" height="20.0" fill="#7d97ee" fill-opacity="0.9"/>
    <rect x="354.39" y="52.0" width="257.98" height="20.0" fill="#d29922" fill-opacity="0.62"/>
    <rect x="612.37" y="52.0" width="90.19" height="20.0" fill="#7d97ee" fill-opacity="0.72"/>
    <rect x="702.56" y="52.0" width="47.33" height="20.0" fill="#7d97ee" fill-opacity="0.56"/>
    <rect x="749.89" y="52.0" width="25.19" height="20.0" fill="#7d97ee" fill-opacity="0.44"/>
    <rect x="775.08" y="52.0" width="20.99" height="20.0" fill="#7d97ee" fill-opacity="0.34"/>
    <rect x="796.07" y="52.0" width="18.50" height="20.0" fill="#7d97ee" fill-opacity="0.25"/>
    <rect x="814.57" y="52.0" width="2.43" height="20.0" fill="#7d97ee" fill-opacity="0.16"/>
  </g>

  <!-- major segment labels -->
  <g class="fade d1">
    <line class="ink" x1="209.2" y1="46" x2="209.2" y2="50.5" stroke-width="0.75" opacity="0.5"/>
    <text class="txt" x="209.2" y="42" font-size="10.5" text-anchor="middle">typescript &#8212; 38.6%</text>
    <line class="ink" x1="483.4" y1="46" x2="483.4" y2="50.5" stroke-width="0.75" opacity="0.5"/>
    <text class="txt" x="483.4" y="42" font-size="10.5" text-anchor="middle">jupyter&#8224; &#8212; 34.3%</text>
    <line class="ink" x1="657.5" y1="46" x2="657.5" y2="50.5" stroke-width="0.75" opacity="0.5"/>
    <text class="txt" x="657.5" y="42" font-size="10.5" text-anchor="middle">html &#8212; 12.0%</text>
  </g>

  <!-- tail legend -->
  <g class="fade d2">
    <rect x="64.0" y="100" width="7" height="7" fill="#7d97ee" fill-opacity="0.56"/>
    <text class="txt" x="75.0" y="107" font-size="9.5" opacity="0.85">python 6.3%</text>
    <rect x="170.2" y="100" width="7" height="7" fill="#7d97ee" fill-opacity="0.44"/>
    <text class="txt" x="181.2" y="107" font-size="9.5" opacity="0.85">javascript 3.3%</text>
    <rect x="305.2" y="100" width="7" height="7" fill="#7d97ee" fill-opacity="0.34"/>
    <text class="txt" x="316.2" y="107" font-size="9.5" opacity="0.85">mdx 2.8%</text>
    <rect x="402.2" y="100" width="7" height="7" fill="#7d97ee" fill-opacity="0.25"/>
    <text class="txt" x="413.2" y="107" font-size="9.5" opacity="0.85">css 2.5%</text>
    <rect x="499.2" y="100" width="7" height="7" fill="#7d97ee" fill-opacity="0.16"/>
    <text class="txt" x="510.2" y="107" font-size="9.5" opacity="0.85">other 0.3%</text>
  </g>
</svg>
