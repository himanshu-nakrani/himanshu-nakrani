    <text class="txt" x="501.83" y="42" font-size="10.5" text-anchor="middle">jupyter† — 32.9%</text>
    <line class="ink" x1="666.33" y1="46" x2="666.33" y2="50.5" stroke-width="0.75" opacity="0.5"/>
    <text class="txt" x="666.33" y="42" font-size="10.5" text-anchor="middle">python — 10.9%</text>
