    <rect x="625.41" y="52.0" width="81.84" height="20.0" fill="#4f6ad0" fill-opacity="0.68"/>
    <rect x="707.25" y="52.0" width="42.61" height="20.0" fill="#4f6ad0" fill-opacity="0.5"/>
    <rect x="749.86" y="52.0" width="24.83" height="20.0" fill="#4f6ad0" fill-opacity="0.38"/>
