    <rect x="794.8" y="52.0" width="18.11" height="20.0" fill="#4f6ad0" fill-opacity="0.18"/>
    <rect x="812.91" y="52.0" width="3.09" height="20.0" fill="#4f6ad0" fill-opacity="0.1"/>
  </g>

  <!-- major segment labels -->
